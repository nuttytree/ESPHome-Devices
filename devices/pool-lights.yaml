substitutions:
  device_id: pool-lights
  device_name: Pool Lights
  board: esp01_1m
  api_key: !secret pool_lights_key
  pwd: !secret pool_lights_pwd

packages:
  device_base: !include ./packages/device_base_esp8266.yaml

external_components:
  - source:
      type: local
      path: ../components
    components: [ power_cycle_pool_light ]

# Required to allow the light to register the color reset service
api:
  custom_services: True

binary_sensor:
  - platform: gpio
    id: top_button
    pin:
      number: 12
      mode: INPUT_PULLUP
    on_press:
      then:
        - light.turn_on: pool_lights
  - platform: gpio
    id: middle_button
    pin:
      number: 5
      mode: INPUT_PULLUP
    on_press:
      then:
        - light.effect.next: pool_lights
  - platform: gpio
    id: bottom_button
    pin:
      number: 3
      mode: INPUT_PULLUP
    on_press:
      then:
        - light.turn_off: pool_lights

light:
  # SR Smith TREO LED pool lights: 8 colors, and the reset sequence from their user guide
  - platform: power_cycle_pool_light
    id: pool_lights
    name: "Pool Lights"
    output: relay_2
    colors:
      - "Slow Change"
      - "White"
      - "Blue"
      - "Green"
      - "Red"
      - "Amber"
      - "Magenta"
      - "Fast Change"
    min_off_time: 5.5s
    color_change_time: 200ms
    reset_sequence:
      - state: "off"
        duration: 5.5s
      - state: "on"
        duration: 250ms
      - state: "off"
        duration: 250ms
      - state: "on"
        duration: 250ms
      - state: "off"
        duration: 250ms
      - state: "on"
        duration: 250ms
      - state: "off"
        duration: 5.5s
    on_turn_on:
      - component.update: power
    on_turn_off:
      - component.update: power

output:
  # - platform: gpio
  #   id: relay_1
  #   pin: 13
  - platform: gpio
    id: relay_2
    pin: 15
  # - platform: gpio
  #   id: relay_3
  #   pin: 4

sensor:
  - platform: template
    name: "Pool Lights Power"
    id: power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return id(pool_lights).current_values.is_on() ? 10.0 : 0.0;
    update_interval: 10s
  - platform: total_daily_energy
    name: Pool Lights
    icon: mdi:flash
    power_id: power
    method: left

status_led:
  pin:
    number: 0
    inverted: true
